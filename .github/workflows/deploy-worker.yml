name: Deploy PakaNews Translation Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Set up Cloudflare Secrets
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Setting up Cloudflare Worker secrets..."
          wrangler secret put TARGET_LANGUAGE --text <<< "id"
          wrangler secret put DEEPL_API_KEY --text <<< "${{ secrets.DEEPL_API_KEY }}"
          wrangler secret put ADMIN_SECRET --text <<< "${{ secrets.ADMIN_SECRET }}"

      - name: Set up KV Namespace
        working-directory: workers
        run: |
          echo "Setting up Cloudflare Worker KV Namespace..."
          wrangler kv:namespace create ${{ secrets.CLOUDFLARE_KV_NAMESPACE }}
          
      - name: Deploy Worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔧 Injecting Cloudflare Account ID into wrangler.toml..."
          sed -i "s|\${CLOUDFLARE_ACCOUNT_ID}|${CLOUDFLARE_ACCOUNT_ID}|g" wrangler.toml

          echo "🚀 Deploying PakaNews worker..."
          wrangler deploy

      - name: Notify Deployment
        run: |
          echo "✅ Worker deployed successfully"
          echo "Secrets configured:"
          echo "  - TARGET_LANGUAGE: id"
          echo "  - DEEPL_API_KEY: ***"
          echo "  - ADMIN_SECRET: ***"
          echo "Cache key format: translation_{id}_{language}"
