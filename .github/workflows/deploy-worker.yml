name: Deploy PakaNews Translation Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check Wrangler version
        run: wrangler --version

      - name: Inject Cloudflare Account ID and Deploy Worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_LANGUAGE: id
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "🔧 Injecting Cloudflare Account ID into wrangler.toml..."
          sed -i "s|\${CLOUDFLARE_ACCOUNT_ID}|${CLOUDFLARE_ACCOUNT_ID}|g" wrangler.toml

          echo "🚀 Deploying PakaNews worker..."
          wrangler deploy --env production --verbose

      - name: Notify Deployment
        run: |
          echo "✅ Worker deployed successfully"
          echo "Cache key format: translation_{id}_{language}"
