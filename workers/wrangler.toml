name = "pakanews"
main = "src/worker.js"
compatibility_date = "2025-11-09"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
# KV namespaces for translation caching
# The cache key format is: translation_{id}_{language}
# This allows multiple language variants to coexist in the same KV namespace
# Example keys: translation_2907_id, translation_2907_ja, translation_2907_en
[[kv_namespaces]]
binding = "TRANSLATION_KV"
id = "96c4a500dd9141ee8df3bf8874e1b40d"
# Production environment secrets and variables
# Secrets are stored in Cloudflare and injected at runtime via GitHub Actions
# - TARGET_LANGUAGE: DeepL target language code (id, ja, en, etc.) - set via wrangler secret
# - DEEPL_API_KEY: DeepL API key for translations - set via wrangler secret
# - ADMIN_SECRET: Secret for /api/admin/invalidate endpoint - set via wrangler secret
#
# These are injected automatically by the worker runtime - no need to define here explicitly
# But documented for clarity

# For local development
# Create .dev.vars file with:
# TARGET_LANGUAGE=id
# DEEPL_API_KEY=451xx1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# ADMIN_SECRET=your-secret-here
#
# For CI/CD deployment via GitHub Actions:
# Secrets are set using: wrangler secret put <name> --text <<< "<value>"
# See .github/workflows/deploy-worker.yml for details

