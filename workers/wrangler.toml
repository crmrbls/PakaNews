name = "pakanews"
type = "javascript"
main = "src/worker.js"
compatibility_date = "2025-11-09"

# KV namespaces for translation caching
# The cache key format is: translation_{id}_{language}
# This allows multiple language variants to coexist in the same KV namespace
# Example keys: translation_2907_id, translation_2907_ja, translation_2907_en
[[kv_namespaces]]
binding = "TRANSLATION_KV"
id = "8387fc78bdde4693865198cfc6e59215"  # PakaNews KV namespace (shared across languages)
preview_id = "8387fc78bdde4693865198cfc6e59215"

# Configuration for local development
# Environment variables control translation behavior:
# - TARGET_LANGUAGE: DeepL target language code (id, ja, en, etc.)
#                     Fallback is 'ja' (Japanese) since Umamusume API is in Japanese
# - DEEPL_API_KEY: DeepL API key for translations
# - ADMIN_SECRET: Secret for /api/admin/invalidate endpoint

# For local development: create .dev.vars file with:
# TARGET_LANGUAGE=id
# DEEPL_API_KEY=451511cc-cd50-436b-9210-954726df55ff:fx
# ADMIN_SECRET=your-secret-here

# For CI/CD deployment with GitHub Actions or similar:
# Export environment variables before deployment:
#   export TARGET_LANGUAGE=id
#   export DEEPL_API_KEY=your-production-key
#   export ADMIN_SECRET=your-production-secret
#   wrangler deploy

